<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Secretary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>📋 My Secretary</h1>
    </div>
    <div class="header-right">
      <button id="settingsBtn" class="btn btn-ghost" aria-label="Open settings">Settings</button>
      <button id="viewArchiveBtn" class="btn btn-ghost">Archive <span id="archiveCount" class="button-count">0</span></button>
      <button id="addTaskBtn" class="btn btn-primary">+ New Task</button>
    </div>
  </header>

  <aside id="updateBanner" class="update-banner hidden" role="status">
    <div>
      <strong>A new version is available</strong>
      <span id="updateMessage"></span>
    </div>
    <button id="updateNowBtn" class="btn btn-primary">View update</button>
    <button id="dismissUpdateBtn" class="btn-icon" aria-label="Dismiss update">✕</button>
  </aside>

  <main id="board">
    <div class="column" data-status="pending">
      <div class="column-header">
        <h2>Pending</h2>
        <span class="badge" id="count-pending">0</span>
      </div>
      <div class="task-list" data-status="pending"></div>
      <button class="add-to-column" data-status="pending">+ Add</button>
    </div>

    <div class="column" data-status="wip">
      <div class="column-header">
        <h2>WIP</h2>
        <span class="badge" id="count-wip">0</span>
      </div>
      <div class="task-list" data-status="wip"></div>
      <button class="add-to-column" data-status="wip">+ Add</button>
    </div>

    <div class="column" data-status="done">
      <div class="column-header">
        <h2>Done</h2>
        <div class="column-actions">
          <button id="archiveDoneBtn" class="btn-icon compact" title="Archive all done tasks" aria-label="Archive all done tasks">Archive all</button>
          <span class="badge" id="count-done">0</span>
        </div>
      </div>
      <div class="task-list" data-status="done"></div>
      <button class="add-to-column" data-status="done">+ Add</button>
    </div>
  </main>

  <!-- Task Modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">New Task</h2>
        <button id="closeModal" class="btn-icon">✕</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId">

        <label>Title <span class="required">*</span></label>
        <input type="text" id="taskTitle" placeholder="Task title..." required>

        <div class="form-row">
          <div>
            <label>Status</label>
            <select id="taskStatus">
              <option value="pending">PENDING</option>
              <option value="wip">WIP</option>
              <option value="done">DONE</option>
            </select>
          </div>
          <div>
            <label>Deadline (Shamsi)</label>
            <input type="text" id="taskShamsi" placeholder="1403/05/15">
          </div>
          <div>
            <label>Miladi Date</label>
            <span id="taskMiladiLabel" class="readonly-label">—</span>
          </div>
        </div>

        <label>Description (Markdown)</label>
        <div class="md-editor-wrapper">
          <div class="md-toolbar">
            <button type="button" data-md="bold" title="Bold"><strong>B</strong></button>
            <button type="button" data-md="italic" title="Italic"><em>I</em></button>
            <button type="button" data-md="h1" title="Heading 1">H1</button>
            <button type="button" data-md="h2" title="Heading 2">H2</button>
            <button type="button" data-md="list" title="Bullet list">• List</button>
            <button type="button" data-md="code" title="Code block">{ }</button>
            <button type="button" data-md="link" title="Link">🔗</button>
            <button type="button" data-md="preview" title="Toggle preview" id="previewBtn">👁 Preview</button>
          </div>
          <textarea id="taskDescription" rows="8" placeholder="Write description in markdown..."></textarea>
          <div id="mdPreview" class="md-preview hidden"></div>
        </div>

        <label>Custom Fields</label>
        <div id="customFieldsContainer"></div>
        <button type="button" id="addFieldBtn" class="btn btn-ghost btn-sm">+ Add Field</button>

        <section id="commentsSection" class="comments-section hidden">
          <label>Comments</label>
          <div class="comment-composer">
            <textarea id="commentBody" rows="3" placeholder="Add a comment..."></textarea>
            <button type="button" id="addCommentBtn" class="btn btn-secondary">Add comment</button>
          </div>
          <div id="commentsList" class="comments-list"></div>
        </section>

        <div id="timestamps" class="timestamps hidden">
          <span id="createdAtLabel">Created: --</span>
          <span id="updatedAtLabel">Updated: --</span>
        </div>

        <div class="modal-footer">
          <button type="button" id="deleteTaskBtn" class="btn btn-danger hidden">Delete</button>
          <span id="draftStatus" class="draft-status hidden" aria-live="polite"></span>
          <div class="spacer"></div>
          <button type="button" id="revertDraftBtn" class="btn btn-ghost hidden">Revert draft</button>
          <button type="button" id="saveDraftBtn" class="btn btn-secondary hidden">Save draft</button>
          <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="archiveOverlay" class="modal-overlay hidden">
    <section class="modal archive-modal" aria-labelledby="archiveTitle">
      <div class="modal-header">
        <div>
          <h2 id="archiveTitle">Archive</h2>
          <p class="modal-subtitle">Completed tasks kept out of your active board.</p>
        </div>
        <button id="closeArchive" class="btn-icon" aria-label="Close archive">✕</button>
      </div>
      <div id="archiveList" class="archive-list"></div>
    </section>
  </div>

  <div id="settingsOverlay" class="modal-overlay hidden">
    <section class="modal settings-modal" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle">Settings</h2>
        <button id="closeSettings" class="btn-icon" aria-label="Close settings">✕</button>
      </div>
      <div class="settings-content">
        <label class="checkbox-setting">
          <input type="checkbox" id="openAtStartup">
          <span><strong>Open at startup</strong><small>Start My Secretary when you log in to your computer.</small></span>
        </label>
        <p id="settingsStatus" class="settings-status" aria-live="polite"></p>
      </div>
    </section>
  </div>

  <script src="../jalaali.js"></script>
  <script src="../marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
