name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  macos-apple-silicon:
    name: Apple Silicon
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS DMG
        run: npm run dist:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Apple Silicon build
        uses: actions/upload-artifact@v4
        with:
          name: my-secretary-macos-arm64
          path: |
            release/*.dmg
            release/*.dmg.blockmap
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Windows build attempt $attempt of $maxAttempts"
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              Write-Host "Build failed; retrying after 15 seconds..."
              Start-Sleep -Seconds 15
            }
          }
          exit 1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: my-secretary-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-apple-silicon, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "v${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${package_version}."
            exit 1
          fi
      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: my-secretary-*
          path: release-assets
          merge-multiple: true
      - name: Create public release with changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --title "My Secretary ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
