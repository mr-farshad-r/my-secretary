name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos-apple-silicon:
    name: Apple Silicon
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS DMG
        run: npm run dist:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Apple Silicon build
        uses: actions/upload-artifact@v4
        with:
          name: my-secretary-macos-arm64
          path: |
            release/*.dmg
            release/*.dmg.blockmap
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: my-secretary-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
